[package]
name = "electioneer"
version = "2.0.0"
description = "Margin of Victory desktop shell (Tauri)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The Win32 activation hook (src/lib.rs). Same version Tauri already uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell"] }

[lib]
name = "electioneer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
