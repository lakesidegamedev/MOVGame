name: Desktop builds

# Builds the Tauri desktop shell on Windows, Linux and macOS. Pushes to
# build/desktop* build the preview channel; a manual run picks the channel.
# Every bundle is unsigned. The three jobs are independent so a slow or
# failing platform never holds up the others.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Distribution channel to build
        type: choice
        default: desktop-preview
        options: [desktop-preview, desktop-direct, steam]
  push:
    branches: ['build/desktop*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.channel || 'desktop-preview' }}
  cancel-in-progress: true

env:
  CHANNEL: ${{ inputs.channel || 'desktop-preview' }}
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/native/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri -> target
          key: windows
      - run: npm ci
      - run: npm ci
        working-directory: apps/native
      - name: Build (${{ env.CHANNEL }})
        working-directory: apps/native
        run: node scripts/desktop-build.mjs ${{ env.CHANNEL }} --bundles nsis
      - name: Cargo.lock drift
        shell: bash
        run: git diff --stat -- apps/native/src-tauri/Cargo.lock
      - name: Collect files
        shell: bash
        run: |
          mkdir -p out
          cp apps/native/src-tauri/target/release/bundle/nsis/*.exe out/
          cp apps/native/src-tauri/target/release/electioneer.exe "out/margin-of-victory-${CHANNEL}-portable.exe"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: mov-windows-${{ env.CHANNEL }}
          path: out/*
          if-no-files-found: error
      - name: Smoke test
        shell: pwsh
        run: ./apps/native/scripts/smoke-windows.ps1 -Exe "out/margin-of-victory-$env:CHANNEL-portable.exe" -Shot windows-smoke.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mov-windows-smoke
          path: windows-smoke.png
          if-no-files-found: warn

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xvfb imagemagick xdotool x11-utils
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/native/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri -> target
          key: linux
      - run: npm ci
      - run: npm ci
        working-directory: apps/native
      - name: Build (${{ env.CHANNEL }})
        working-directory: apps/native
        env:
          # linuxdeploy's bundled strip cannot read newer system libraries.
          NO_STRIP: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: node scripts/desktop-build.mjs "$CHANNEL" --bundles appimage,deb
      - name: Collect files
        run: |
          mkdir -p out
          cp apps/native/src-tauri/target/release/bundle/appimage/*.AppImage out/
          cp apps/native/src-tauri/target/release/bundle/deb/*.deb out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: mov-linux-${{ env.CHANNEL }}
          path: out/*
          if-no-files-found: error
      - name: Smoke test (xvfb)
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            apps/native/src-tauri/target/release/electioneer > app.log 2>&1 &
            pid=$!
            win=""
            for i in $(seq 1 30); do
              win=$(xdotool search --onlyvisible --name "Margin of Victory" 2>/dev/null | head -n1)
              [ -n "$win" ] && break
              sleep 2
            done
            sleep 12
            import -window root linux-smoke.png
            alive=no; kill -0 $pid 2>/dev/null && alive=yes
            title=""; [ -n "$win" ] && title=$(xdotool getwindowname "$win")
            colours=$(identify -format "%k" linux-smoke.png)
            echo "alive=$alive window=$win title=$title distinctColours=$colours"
            echo "--- windows"; xwininfo -root -tree | grep -i -E "margin|electioneer" | head -n 20
            kill $pid 2>/dev/null || true
            [ "$alive" = yes ] && [ -n "$win" ] && [ "$colours" -gt 16 ]
          '
          rc=$?
          echo "--- app log"; tail -n 50 app.log || true
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mov-linux-smoke
          path: |
            linux-smoke.png
            app.log
          if-no-files-found: warn

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/native/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri -> target
          key: macos
      - run: npm ci
      - run: npm ci
        working-directory: apps/native
      - name: Build (${{ env.CHANNEL }})
        working-directory: apps/native
        run: node scripts/desktop-build.mjs "$CHANNEL" --bundles app
      - name: Package unsigned .app and .dmg
        run: |
          mkdir -p out
          app=$(ls -d apps/native/src-tauri/target/release/bundle/macos/*.app | head -n1)
          name=$(basename "$app" .app)
          ditto -c -k --keepParent "$app" "out/${name}-${CHANNEL}-macos-unsigned.zip"
          hdiutil create -volname "$name" -srcfolder "$app" -ov -format UDZO "out/${name}-${CHANNEL}-macos-unsigned.dmg"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: mov-macos-${{ env.CHANNEL }}
          path: out/*
          if-no-files-found: error
