name: Desktop builds

# Builds the Tauri desktop shell on Windows, Linux and macOS. Pushes to
# build/desktop* build the preview channel; a manual run picks the channel.
# Every bundle is unsigned. The three jobs are independent so a slow or
# failing platform never holds up the others.
#
# Smoke tests (apps/native/docs/desktop.md lists what each one proves):
# - Windows: the full player lifecycle on desktop-direct installers (install an
#   older build, play to week two, upgrade, resume the save, Buy opens checkout
#   in the system browser and the purchase is picked up, uninstall keeps saves,
#   reinstall), then a preview installer next to it. Driven over WebView2's
#   debugging port by apps/native/scripts/desktop-smoke.mjs, on CI test builds
#   of the same commit that open that port.
# - Linux: the AppImage and the .deb (install, run, remove).
# - macOS: open the .app, check its window, and record what Gatekeeper does
#   with a downloaded copy. Then a CI autoplay build of the same commit
#   (desktop-build.mjs --ci-autoplay, never uploaded) plays the free US
#   campaign to week two by itself and the desk is screenshotted there.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Distribution channel to build
        type: choice
        default: desktop-preview
        options: [desktop-preview, desktop-direct, steam]
      lifecycle:
        description: Run the Windows install, upgrade, checkout and uninstall test
        type: boolean
        default: true
  push:
    branches: ['build/desktop*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.channel || 'desktop-preview' }}
  cancel-in-progress: true

env:
  CHANNEL: ${{ inputs.channel || 'desktop-preview' }}
  # Pushes always run it; a manual run can turn it off.
  LIFECYCLE: ${{ github.event_name == 'push' || inputs.lifecycle }}
  CARGO_TERM_COLOR: always
  # Error reporting: the one shared setting, baked into every web bundle these
  # jobs build. Empty or absent keeps it off.
  VITE_SENTRY_DSN: ${{ secrets.MOV_SENTRY_DSN }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/native/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri -> target
          key: windows
      - run: npm ci
      - run: npm ci
        working-directory: apps/native
      - name: Build (${{ env.CHANNEL }})
        working-directory: apps/native
        run: node scripts/desktop-build.mjs ${{ env.CHANNEL }} --bundles nsis
      - name: Cargo.lock drift
        shell: bash
        run: git diff --stat -- apps/native/src-tauri/Cargo.lock
      - name: Collect files
        shell: bash
        run: |
          mkdir -p out
          cp apps/native/src-tauri/target/release/bundle/nsis/*.exe out/
          cp apps/native/src-tauri/target/release/electioneer.exe "out/margin-of-victory-${CHANNEL}-portable.exe"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: mov-windows-${{ env.CHANNEL }}
          path: out/*
          if-no-files-found: error
      - name: Smoke test (portable exe)
        shell: pwsh
        run: ./apps/native/scripts/smoke-windows.ps1 -Exe "out/margin-of-victory-$env:CHANNEL-portable.exe" -Shot windows-smoke.png
      # CI test installers: the same code with WebView2's debugging port open so
      # desktop-smoke.mjs can drive the game (WebView2 ignores the environment
      # variable for that, because wry always sets its own browser arguments).
      # They are never uploaded.
      - name: Build lifecycle installers (desktop-direct 1.9.0 and current, preview)
        if: ${{ !cancelled() && env.LIFECYCLE == 'true' }}
        shell: bash
        working-directory: apps/native
        run: |
          set -e
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          nsis=src-tauri/target/release/bundle/nsis
          mkdir -p ../../lifecycle
          node scripts/desktop-build.mjs desktop-direct --app-version 1.9.0 --ci-debug-port 9222 --bundles nsis
          cp "$nsis/Margin of Victory_1.9.0_x64-setup.exe" ../../lifecycle/old-setup.exe
          node scripts/desktop-build.mjs desktop-direct --ci-debug-port 9222 --bundles nsis
          cp "$nsis/Margin of Victory_${version}_x64-setup.exe" ../../lifecycle/new-setup.exe
          node scripts/desktop-build.mjs desktop-preview --ci-debug-port 9222 --bundles nsis
          cp "$nsis/Margin of Victory Preview_${version}_x64-setup.exe" ../../lifecycle/preview-setup.exe
          ls -la ../../lifecycle
      - name: Install, upgrade, play, buy, uninstall
        timeout-minutes: 30
        if: ${{ !cancelled() && env.LIFECYCLE == 'true' }}
        shell: pwsh
        run: ./apps/native/scripts/smoke-windows-lifecycle.ps1 -OldSetup lifecycle/old-setup.exe -NewSetup lifecycle/new-setup.exe -PreviewSetup lifecycle/preview-setup.exe -Out smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mov-windows-smoke
          path: |
            windows-smoke.png
            smoke/
          if-no-files-found: warn

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xvfb imagemagick xdotool x11-utils
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/native/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri -> target
          key: linux
      - run: npm ci
      - run: npm ci
        working-directory: apps/native
      - name: Build (${{ env.CHANNEL }})
        working-directory: apps/native
        env:
          # linuxdeploy's bundled strip cannot read newer system libraries.
          NO_STRIP: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: node scripts/desktop-build.mjs "$CHANNEL" --bundles appimage,deb
      - name: Collect files
        run: |
          mkdir -p out
          cp apps/native/src-tauri/target/release/bundle/appimage/*.AppImage out/
          cp apps/native/src-tauri/target/release/bundle/deb/*.deb out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: mov-linux-${{ env.CHANNEL }}
          path: out/*
          if-no-files-found: error
      - name: Smoke test (AppImage and .deb under xvfb)
        timeout-minutes: 15
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s "-screen 0 1280x800x24" bash apps/native/scripts/smoke-linux.sh out smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mov-linux-smoke
          path: smoke/
          if-no-files-found: warn

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/native/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri -> target
          key: macos
      - run: npm ci
      - run: npm ci
        working-directory: apps/native
      - name: Build (${{ env.CHANNEL }})
        working-directory: apps/native
        run: node scripts/desktop-build.mjs "$CHANNEL" --bundles app
      - name: Package unsigned .app and .dmg
        run: |
          mkdir -p out
          app=$(ls -d apps/native/src-tauri/target/release/bundle/macos/*.app | head -n1)
          name=$(basename "$app" .app)
          # Tauri leaves only the linker's ad-hoc signature on the binary, which
          # Gatekeeper rejects for a downloaded copy ("code has no resources but
          # signature indicates they must be present"). Seal the whole bundle
          # ad hoc so testers get the normal "Open Anyway" path. A Developer ID
          # signature replaces this once there is one.
          ditto "$app" "$RUNNER_TEMP/unsealed/$name.app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --keepParent "$app" "out/${name}-${CHANNEL}-macos-unsigned.zip"
          hdiutil create -volname "$name" -srcfolder "$app" -ov -format UDZO "out/${name}-${CHANNEL}-macos-unsigned.dmg"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: mov-macos-${{ env.CHANNEL }}
          path: out/*
          if-no-files-found: error
      - name: Smoke test (open the .app)
        timeout-minutes: 10
        run: |
          app=$(ls -d apps/native/src-tauri/target/release/bundle/macos/*.app | head -n1)
          bash apps/native/scripts/smoke-macos.sh "$app" smoke "$RUNNER_TEMP/unsealed/$(basename "$app")"
      # WKWebView has no debugging port to drive the game from outside, so this
      # test build plays by itself and reports to 127.0.0.1. Never uploaded.
      - name: Build CI autoplay app
        if: ${{ !cancelled() }}
        working-directory: apps/native
        run: |
          node scripts/desktop-build.mjs "$CHANNEL" --ci-autoplay 47990 --bundles app
          mkdir -p "$RUNNER_TEMP/autoplay"
          app=$(ls -d src-tauri/target/release/bundle/macos/*.app | head -n1)
          ditto "$app" "$RUNNER_TEMP/autoplay/$(basename "$app")"
          codesign --force --deep --sign - "$RUNNER_TEMP/autoplay/$(basename "$app")"
      - name: Smoke test (play to week two)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: bash apps/native/scripts/smoke-macos-play.sh "$(ls -d "$RUNNER_TEMP"/autoplay/*.app | head -n1)" smoke/play 47990
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mov-macos-smoke
          path: smoke/
          if-no-files-found: warn
