name: Native and web

# CI cost rules (keep these when editing):
# - Every PR and push gets the fast tier: web checks plus shared Kotlin tests and the Android
#   build, on Linux, in about 15 to 30 minutes.
# - The device tier (Android emulator, iOS simulators on macOS) is slow and expensive. It runs
#   only when app code changed (iOS app, Android app, shared Kotlin sources, this workflow or the
#   device scripts), and never on a draft PR. Content and web-only changes never start it.
# - A device loop on purpose: push to build/ios* or build/android* (one platform each), or run
#   this workflow by hand with the matching input.
# - build/desktop* belongs to desktop.yml and never starts this workflow.
on:
  workflow_dispatch:
    inputs:
      ios:
        description: Run the iOS simulator jobs
        type: boolean
        default: false
      android:
        description: Run the Android emulator job
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, 'build/**', '!build/desktop*']

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Decide device jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.pick.outputs.ios }}
      android: ${{ steps.pick.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          IN_IOS: ${{ inputs.ios }}
          IN_ANDROID: ${{ inputs.android }}
        run: |
          ios=false; android=false
          if [ "$EVENT" = workflow_dispatch ]; then
            ios=$IN_IOS; android=$IN_ANDROID
          elif [ "$EVENT" = pull_request ] && [ "$DRAFT" = true ]; then
            :
          else
            case "$REF" in
              build/ios*) ios=true ;;
              build/android*) android=true ;;
              *)
                base=$PR_BASE; [ -n "$base" ] || base=$PUSH_BEFORE
                if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
                  files=$(git show --name-only --format= HEAD)
                else
                  files=$(git diff --name-only "$base" HEAD)
                fi
                shared='^(apps/native/shared/src/[a-zA-Z]+Main/kotlin/|apps/native/shared/build\.gradle|apps/native/gradle/|\.github/workflows/native\.yml$)'
                echo "$files" | grep -Eq "$shared|^apps/native/iosApp/|^scripts/.*ios" && ios=true
                echo "$files" | grep -Eq "$shared|^apps/native/androidApp/|^scripts/.*android" && android=true
                ;;
            esac
          fi
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "Device jobs: ios=$ios android=$android"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 "${{ github.workspace }}/scripts/verify-ios-metadata.py"
      - run: python3 "${{ github.workspace }}/scripts/test-ios-screen-ready.py"
      - run: python3 "${{ github.workspace }}/scripts/test-ios-simulator-control.py"
      - run: python3 "${{ github.workspace }}/scripts/test-android-ui-semantics.py"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Typecheck the MOV backend
        run: npx tsc --project tsconfig.server.json
      - name: Check native content matches web
        run: npm run native:content -- --check
      - name: Check native plan vectors match web
        run: npx tsx apps/native/scripts/export-plan-vectors.ts --check
      - name: Check complete native campaign vectors match web
        run: npx tsx apps/native/scripts/export-campaign-vectors.ts --check
      - name: Check web save interchange fixture
        run: npx tsx apps/native/scripts/export-save-vector.ts --check
      - name: Check interactive debate answers match web
        run: npx tsx apps/native/scripts/export-debate-vectors.ts --check
      - name: Check native replay logs and reports match web
        run: npx tsx apps/native/scripts/export-replay-vectors.ts --check
      - name: Check native Ask campaign snapshots match web
        run: npx tsx apps/native/scripts/export-ask-vectors.ts --check
      - name: Check native election-night allocations and schedules
        run: npx tsx apps/native/scripts/export-reveal-vectors.ts --check
      - run: npx tsx apps/native/scripts/export-daily-percentiles.ts --check
      - run: npx tsx apps/native/scripts/export-editor-vectors.ts --check
      - name: Check native plurality rule matches web
        run: npx tsx apps/native/scripts/export-plurality-vectors.ts --check
      - name: Verify desktop uses this checkout
        run: node apps/native/scripts/fetch-web.mjs steam
  android:
    name: Native tests and Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:jvmTest :androidApp:testDebugUnitTest :androidApp:assembleDebug --no-daemon --max-workers=2
      - name: Verify packaged Android startup metadata
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print androidApp/build/outputs/apk/debug/androidApp-debug.apk > "$RUNNER_TEMP/mov-android-manifest.xml"
          python3 ../../scripts/verify-android-metadata.py "$RUNNER_TEMP/mov-android-manifest.xml"
      - name: Verify packaged Android campaign content
        run: python3 ../../scripts/verify-android-bundles.py androidApp/build/outputs/apk/debug/androidApp-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mov-android-debug
          path: apps/native/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7
  android-flows:
    name: Android emulator flows
    needs: [android, changes]
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mov-android-debug
          path: android-apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: python3 scripts/android-launch-smoke.py android-apk/androidApp-debug.apk android-captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-flows
          path: android-captures
          retention-days: 7
  ios:
    name: iOS simulator launch
    needs: changes
    if: ${{ needs.changes.outputs.ios == 'true' }}
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/native
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: >-
          xcodebuild -project iosApp/MOVGameiOS.xcodeproj
          -scheme MOVGameiOS -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/mov-derived"
          CODE_SIGNING_ALLOWED=NO build
      - name: Verify packaged campaign content
        run: python3 ../../scripts/verify-ios-bundles.py "$RUNNER_TEMP/mov-derived/Build/Products/Release-iphonesimulator/MOVGameiOS.app"
      - name: Package unsigned simulator app for runtime compatibility testing
        run: tar -C "$RUNNER_TEMP/mov-derived/Build/Products/Release-iphonesimulator" -czf "$RUNNER_TEMP/mov-simulator.tar.gz" MOVGameiOS.app
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-simulator-app
          path: ${{ runner.temp }}/mov-simulator.tar.gz
          retention-days: 3
      - name: Launch app on iPhone simulator
        env:
          MOV_CAPTURE_SCREENS: '1'
          MOV_FRESH_SIMULATOR: '1'
        run: python3 ../../scripts/ios-launch-smoke.py "$RUNNER_TEMP/mov-derived/Build/Products/Release-iphonesimulator/MOVGameiOS.app" "$RUNNER_TEMP/mov-launch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-launch
          path: ${{ runner.temp }}/mov-launch
  ios-layouts:
    name: Small iPhone and iPad flows
    needs: ios
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-ios-simulator-app
          path: ${{ runner.temp }}/mov-layouts
      - name: Capture small phone and tablet navigation
        run: |
          tar -xzf "$RUNNER_TEMP/mov-layouts/mov-simulator.tar.gz" -C "$RUNNER_TEMP/mov-layouts"
          python3 scripts/ios-layout-smoke.py "$RUNNER_TEMP/mov-layouts/MOVGameiOS.app" "$RUNNER_TEMP/mov-layout-captures"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-layout-flows
          path: ${{ runner.temp }}/mov-layout-captures
  ios27:
    name: iOS 27 iPhone 17 Pro Max launch
    needs: ios
    if: ${{ always() && (needs.ios.result == 'success' || needs.ios.result == 'failure') }}
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-ios-simulator-app
          path: ${{ runner.temp }}/mov-compat
      - name: Launch existing Release binary on iOS 27
        env:
          MOV_CAPTURE_SCREENS: '1'
        run: |
          tar -xzf "$RUNNER_TEMP/mov-compat/mov-simulator.tar.gz" -C "$RUNNER_TEMP/mov-compat"
          SIMULATOR_UDID=$(xcrun simctl create 'iPhone 17 Pro Max MOV' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          export SIMULATOR_UDID
          python3 scripts/ios-launch-smoke.py "$RUNNER_TEMP/mov-compat/MOVGameiOS.app" "$RUNNER_TEMP/mov-ios27-launch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios27-simulator-launch
          path: ${{ runner.temp }}/mov-ios27-launch
