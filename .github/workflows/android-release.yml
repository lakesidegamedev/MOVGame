name: Android release bundle

# Builds the signed Android App Bundle (AAB) for Google Play and attaches it to
# the run for a short time. It does not publish to Play: download the bundle
# from the run and upload it to the Play Console by hand. Manual only, and only
# from the default branch, like the iOS TestFlight workflow.

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full reviewed default-branch commit SHA
        required: true
        type: string
      signed:
        description: Require signing (turn off only to prove the bundle builds)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - name: Require the exact reviewed default-branch commit
        working-directory: .
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          actual=$(git rev-parse HEAD)
          if ! printf '%s' "$REVIEWED_SHA" | grep -Eq '^[0-9a-f]{40}$' || [ "$actual" != "$REVIEWED_SHA" ]; then
            echo "Choose the default branch and its exact reviewed commit" >&2
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared engine tests
        run: ./gradlew :shared:jvmTest --no-daemon --max-workers=2
      - name: Restore the upload key
        id: key
        env:
          SIGNED: ${{ inputs.signed }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing ANDROID_$name"
          done
          if [ -n "$missing" ]; then
            if [ "$SIGNED" = true ]; then
              echo "Missing repository secrets:$missing" >&2
              exit 1
            fi
            echo "Unsigned build: missing secrets:$missing"
            exit 0
          fi
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          {
            echo "MOV_ANDROID_KEYSTORE_FILE=$keystore"
            echo "MOV_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MOV_ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "MOV_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
      - name: Build the release bundle
        env:
          MOV_SENTRY_DSN: ${{ secrets.MOV_SENTRY_DSN }}
        run: ./gradlew :androidApp:bundleRelease -PMOV_VERSION_CODE="$((2000000 + GITHUB_RUN_NUMBER))" --no-daemon --max-workers=2
      - name: Check the bundle
        env:
          SIGNED: ${{ inputs.signed }}
        run: |
          aab=androidApp/build/outputs/bundle/release/androidApp-release.aab
          test -f "$aab"
          python3 ../../scripts/verify-android-bundle-aab.py "$aab" "$SIGNED"
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: mov-android-release-aab
          path: apps/native/androidApp/build/outputs/bundle/release/*.aab
          retention-days: 14
